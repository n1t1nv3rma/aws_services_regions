[project]
name = "aws-services-regions"
version = "0.1.1"
description = "Fast MCP server that helps LLMs to optimally and accurately find list of all AWS services available in AWS regions."
readme = "README.md"
# 3.11+ for tomllib, used to read this file's version at startup.
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=2.2.0,<3",
    "bs4>=0.0.2",
    # Declared explicitly: mcp 2.x switched to httpx2, so httpx is no longer
    # pulled in transitively.
    "httpx>=0.28.1",
]
